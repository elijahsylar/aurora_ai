<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Session length distribution</title>
<desc id="d">Histogram of session length for 2,987 pilot sessions with an end time and non-negative duration. 0–1 minutes: 227; 1–5 minutes: 371; 5–15 minutes: 345; 15–30 minutes: 362; 30–45 minutes: 779; 45–60 minutes: 70; 60–70 minutes: 793; 70–90 minutes: 15; 90–180 minutes: 11; &gt;180 minutes: 14. The two tallest bins, 30 to 45 minutes (779) and 60 to 70 minutes (793), match the 30-minute and 65-minute rotation intervals used during the pilot.</desc>
